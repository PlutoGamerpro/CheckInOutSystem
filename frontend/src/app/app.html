<nav class="app-navbar navbar navbar-expand-lg" role="navigation" aria-label="Main">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2" [routerLink]="['/']">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">CheckInOut</span>
    </a>

    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link" routerLink="/admin-login" *ngIf="!checkAdminToken()" routerLinkActive="active">Admin portal</a>
        <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Check In</a>
        <a class="nav-link" routerLink="/signup" routerLinkActive="active">Create Account</a>

      </div>

        <button class="btn btn-sm btn-outline-light" (click)="logout()" *ngIf="checkAdminToken()">Logout</button>
      </div>
    </div>
  </div>
</nav>
